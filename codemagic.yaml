workflows:
  singmatch-ios:
    name: Sing Match iOS
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: Berfau ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.stevenwilliams.singmatch
      vars:
        APP_ID: 6838518656
      xcode: latest
    cache:
      cache_paths:
        - $HOME/.cache/uv
    scripts:
      - name: Build the vocal separation model (ONNX to Core ML)
        script: |
          set -e
          curl -L --fail -o /tmp/vocals.onnx \
            https://github.com/TRvlvr/model_repo/releases/download/all_public_uvr_models/UVR-MDX-NET-Voc_FT.onnx
          brew install uv
          uv venv -p 3.11 /tmp/cmenv
          source /tmp/cmenv/bin/activate
          uv pip install "torch==2.7.0" "torchvision==0.22.0" "coremltools==9.0" onnx onnx2torch onnxruntime "numpy<2"
          python scripts/convert_model.py /tmp/vocals.onnx /tmp/VocalsModel.mlpackage || {
            echo "=== Conversion check failed: finding the first op Core ML gets wrong ==="
            python scripts/debug_model.py /tmp/vocals.onnx 2>&1 | grep -v -E "Converting|Running|MLModel|ComputeDevice|ComputePlan"
            exit 1
          }
          rm -rf SingMatch/Resources/VocalsModel.mlmodelc
          xcrun coremlcompiler compile /tmp/VocalsModel.mlpackage SingMatch/Resources/
          ls -la SingMatch/Resources/VocalsModel.mlmodelc
      - name: Generate Xcode project
        script: |
          # project.yml is written here so the build never depends on uploading it separately
          cat > project.yml <<'PROJECT_EOF'
          name: SingMatch
          options:
            bundleIdPrefix: com.stevenwilliams
            deploymentTarget:
              iOS: "16.0"
            createIntermediateGroups: true
          targets:
            SingMatch:
              type: application
              platform: iOS
              sources:
                - path: SingMatch
                  excludes:
                    - "Resources/VocalsModel.mlmodelc"
                    - "Resources/VocalsModel.mlmodelc/**"
                    - "Resources/*.onnx"
                    - "Resources/*.mlpackage/**"
                # Compiled Core ML model (created by the Codemagic build), bundled as-is
                - path: SingMatch/Resources/VocalsModel.mlmodelc
                  type: folder
                  buildPhase: resources
              info:
                path: SingMatch/Info.plist
                properties:
                  CFBundleDisplayName: Sing Match
                  CFBundleShortVersionString: $(MARKETING_VERSION)
                  CFBundleVersion: $(CURRENT_PROJECT_VERSION)
                  NSMicrophoneUsageDescription: Sing Match listens to your singing so it can show your pitch and score how well you match the song.
                  UILaunchScreen: {}
                  UIApplicationSupportsIndirectInputEvents: true
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                  ITSAppUsesNonExemptEncryption: false
                  LSSupportsOpeningDocumentsInPlace: true
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.stevenwilliams.singmatch
                  MARKETING_VERSION: "1.0"
                  CURRENT_PROJECT_VERSION: "1"
                  VERSIONING_SYSTEM: apple-generic
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
                  ENABLE_BITCODE: NO
              scheme: {}
          PROJECT_EOF
          brew install xcodegen
          xcodegen generate
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Set build number (one higher than the latest on TestFlight)
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_ID" || echo 0)
          agvtool new-version -all $((LATEST + 1))
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project SingMatch.xcodeproj \
            --scheme SingMatch
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
