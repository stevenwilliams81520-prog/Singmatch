name: SingMatch
options:
  bundleIdPrefix: com.stevenwilliams
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: 1.17.0
targets:
  SingMatch:
    type: application
    platform: iOS
    sources:
      - path: SingMatch
    dependencies:
      - package: onnxruntime
        product: onnxruntime
    info:
      path: SingMatch/Info.plist
      properties:
        CFBundleDisplayName: Sing Match
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: Sing Match listens to your singing so it can show your pitch and score how well you match the song.
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stevenwilliams.singmatch
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_BITCODE: NO
    scheme: {}
